# ウサちゃんロボ 設定
# Step 1: PC 単体（マイクもスピーカーも PC）

wake:
  # whisper の表記ゆれを吸収するため、ひらがな正規化して部分一致で判定する
  words: ["うさちゃん", "うさぎちゃん", "うさちゃんロボ", "うさぎちゃんロボ"]
  # 一度起動したら、この秒数はウェイクワード不要で会話を続ける
  conversation_window_sec: 20
  # 認識のゆれを許す編集距離。0 で完全一致のみ。
  # whisper は「ウサちゃん」を「おさちゃん」と綴ることがあるため 1 が既定
  fuzzy_distance: 1
  # 呼ばれただけ（用件なし）のときの返し
  greeting: "はい、なんでしょう？"

audio:
  input_device: null        # null = OS のデフォルト
  output_device: null
  # 音声の出力先。local=PCのスピーカー / coreS3=ウサギ / both=両方
  # 実機が繋がったので coreS3。手元でも聴きたいときだけ both に戻す
  output: "coreS3"
  # 音声の入力元。coreS3=ロボットのマイク / local=PCのマイク
  # ロボットのマイクとスピーカーは I2S を共有していて同時に開けないため、
  # 喋っている間は耳が塞がる（半二重）。詳細は docs/core-mic.md。
  # ロボットの聞こえが怪しいときは local にすると切り分けられる（--pc-mic）
  input: "coreS3"
  # ロボットのマイクが遠くて音が小さいときだけ上げる（input: coreS3 用）。
  # まず firmware/src/config.h の MIC_MAGNIFICATION を上げるほうが素性がよい
  input_gain: 1.0
  sample_rate: 16000        # VAD / STT が 16kHz を要求するので固定
  frame_samples: 512        # Silero VAD v5 は 16kHz で 512 サンプル固定

vad:
  threshold: 0.5            # 発話とみなす確率のしきい値
  # 有音がこれ未満の区間は雑音として捨てる。**プリロールは数えない。**
  # 総フレーム数で数えるとプリロール 300ms が下駄になって必ず超えてしまい、
  # 物音1つで 0.29 秒の区間が量産され、whisper が幻聴を返していた
  min_speech_ms: 250
  hangover_ms: 400          # 発話が十分長いときの終端判定（無音がこの長さ続いたら終わり）
  # 発話がまだ短いあいだは長めに待つ。「ウサちゃん、（間）今日は…」のような
  # 自然な間で分断されると、認識が崩れ、末尾の断片では幻聴まで出る
  hangover_ms_short: 800
  short_utterance_ms: 1200  # 有音がこれ未満なら「まだ続く」とみなす
  max_utterance_sec: 15     # 保険。これを超えたら強制的に切る

stt:
  model: "medium"           # 実マイクの実測で最良。VRAM +596MiB で LLM と同居できる
  device: "cuda"            # 実測 976ms(cpu) -> 114ms(gpu)。失敗時は自動で cpu に落ちる
  compute_type: "int8_float16"   # cpu に落ちた場合は int8 が使われる
  language: "ja"
  # 固有名詞を先に見せると綴りは安定するが、似た音まで引き寄せて誤反応が増える。
  # 実測では null + wake.fuzzy_distance=1 が最良（取りこぼし 0/5・誤反応 0/10）だった。
  # 詳細は docs/dialogue-system.md の「ウェイクワード」節。
  initial_prompt: null
  # 1=貪欲法(最速) / 5=ビームサーチ(高精度)。
  # medium では beam=5 にしても結果が変わらなかったので 1 でよい
  beam_size: 1
  # 無音やノイズを渡されると whisper は字幕由来の幻聴を返す。
  # そのとき no_speech_prob は 0.9 台、本物の音声は 0.1 未満（実測）。
  # これを超えた区間は捨てる。誤検出が気になるなら上げる
  no_speech_threshold: 0.6
  # 確度をすり抜ける幻聴の2層目。部分一致で捨てる。
  # whisper は字幕を大量に学習しており、動画の締めの決まり文句を返すことがある。
  # ロボットに話しかける言葉として出る可能性が低いものだけを入れること。
  # 新しい変種を見かけたらここに足す。
  hallucination_patterns:
    - "ご視聴"           # ご視聴ありがとうございました / 最後までご視聴〜
    - "チャンネル登録"
    - "ご覧いただきありがとう"  # 以上、チャンネルをご覧いただきありがとうございます
    - "エンディング"
  # 弾いた区間の音声を recordings/rejected/ に残す。
  # 幻聴なのか、テレビなどの本物の音声を拾っただけなのかは聞かないと分からない。
  # 原因が分かったら false にしてよい
  save_rejected: true
  # 通した区間も recordings/heard/ に残す（音声＋認識結果）。
  # 精度を詰めるときは、言ったことと聞こえたことを並べないと判断できない。
  # 部屋の会話がそのままディスクに残るので、既定は false。測るときだけ true に
  save_heard: false

llm:
  backend: "ollama"         # ollama / claude
  model: "qwen3:4b-instruct"   # 非推論モデル必須。qwen3:4b（推論版）は思考が止まらず使えない
  host: "http://127.0.0.1:11434"
  max_history_turns: 8      # 保持する往復数
  num_predict: 200          # 返答の最大トークン
  num_ctx: 2048             # 小さいほど VRAM に載る。4GB では 2048 が実測で最速
  temperature: 0.8
  # backend: claude のとき使用（ANTHROPIC_API_KEY が必要）
  claude_model: "claude-opus-5"

tts:
  host: "http://127.0.0.1:50021"
  speaker: 1                # ずんだもん / あまあま。聴き比べて決定（--sample-speakers）
  speed: 1.1
  pitch: 0.0
  intonation: 1.0

persona:
  # 公開用のベース。原作の文章は書かないこと
  file: "persona/usachan.md"
  # 原作のセリフ例など、公開したくない内容はこちら。
  # 存在すれば自動で読み込んでベースに追記する。
  # .gitignore と pre-commit フックの両方で保護されており、リポジトリには入らない。
  local_file: "persona/usachan.local.md"
  # 出力フォーマットの規則。必ず最後に置かれる（小型モデルは後ろの指示ほど守る）
  rules_file: "persona/rules.md"

# CoreS3 との WebSocket 接続（audio.output が coreS3 または both のとき有効）
transport:
  host: "0.0.0.0"           # LAN 内から繋げるよう全インターフェースで待ち受ける
  port: 8765
  path: "/rabbit"
  chunk_ms: 20              # 送信する PCM チャンクの長さ
  wait_client_sec: 0        # --text 実行時に接続を待つ秒数（0 で待たない）

behavior:
  # 音声での割り込みは実装しない。ロボットのマイクとスピーカーは I2S を
  # 共有していて同時に開けないため、喋っている間は聞いていない（半二重）。
  # 割り込みが要るならタッチか IMU を使う。
  # 詳細は docs/dialogue-system.md の「音響エコーと barge-in」を参照。
  barge_in: false

debug:
  print_transcript: true
  print_llm_raw: false
