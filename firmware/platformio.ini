; ウサちゃんロボ CoreS3 ファームウェア
;
; ビルド:  pio run
; 書き込み: pio run -t upload
; シリアル: pio device monitor
;
; 繋ぎ方で環境を分けてある（詳細は ../docs/wireless-link.md）。
;
;   pio run -e m5stack-cores3 -t upload   既にある AP に参加する（既定）
;                                         = 家の WiFi ルータ / PC のホットスポット
;   pio run -e robot-ap       -t upload   この機体が親機になる（ルータ不要）
;
; PC 側の pc/config.yaml の transport.link と揃えること。
;
; PC 側の仕様は tools/protocol_test.py が固定している。
; プロトコルを変えるときは、あちらのテストも合わせて更新すること。

[env]
platform = espressif32
board = m5stack-cores3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; PSRAM を使う。音声のリングバッファを内蔵 RAM から追い出すため
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.1.0

; 既にある AP に参加して、PC へ繋ぎに行く（LINK_STA）。
; 相手が家の WiFi ルータでも PC のモバイルホットスポットでも同じ
[env:m5stack-cores3]

; この機体が親機（SoftAP）になり、PC が繋ぎに来る（LINK_ROBOT_AP）。
; ルータもインターネットも要らない。接続先は 192.168.4.1 に固定される。
;
; secrets.local.h に書いてもよいが、環境を分けておくと
; 書き換えずに両方を試せる（別々のビルドディレクトリになる）
[env:robot-ap]
build_flags =
    ${env.build_flags}
    -DLINK_MODE=LINK_ROBOT_AP
