; ウサちゃんロボ CoreS3 ファームウェア
;
; ビルド:  pio run
; 書き込み: pio run -t upload
; シリアル: pio device monitor
;
; PC 側の仕様は tools/protocol_test.py が固定している。
; プロトコルを変えるときは、あちらのテストも合わせて更新すること。

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; PSRAM を使う。音声のリングバッファを内蔵 RAM から追い出すため
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.1.0
